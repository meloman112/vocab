services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Порт наружу не публикуется: до базы ходит только api по docker-сети.

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # DSN собирается здесь из POSTGRES_*, чтобы пароль базы не был
      # записан в .env дважды и не разъехался между копиями.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      # Слушаем адрес из BIND_ADDR — это NetBird-адрес хоста (100.x.x.x).
      # TLS и публичный домен даёт reverse proxy самого NetBird, поэтому
      # порт не должен торчать на публичном интерфейсе: 0.0.0.0 открыл бы
      # API всему интернету в обход оверлея.
      # Умолчание 127.0.0.1 намеренно бесполезно снаружи: забытый BIND_ADDR
      # обязан сломать доступ, а не тихо открыть его всем.
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "vocab.bot"]
    depends_on:
      api:
        # Бот ходит в API за всем, включая список для напоминаний,
        # поэтому стартовать раньше него ему незачем.
        condition: service_healthy

volumes:
  pgdata:
