[project]
name = "vocab"
version = "0.1.0"
description = "Личный SRS для английских слов: FastAPI + FSRS + Telegram"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "asyncpg==0.31.0",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "fsrs==6.3.2",
    "aiogram==3.31.0",
    "apscheduler==3.11.3",
    "fastmcp==4.0.2",
    "lemminflect==0.2.3",
    "wordfreq==3.1.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
